<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Caldas Cup 2026 — Sistema Oficial</title>
  <meta name="description" content="Sistema oficial de gestão da Caldas Cup 2026.">
  <meta name="theme-color" content="#071c29">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Caldas Cup">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Caldas Cup 2026 — Sistema Oficial">
  <meta property="og:description" content="Acesse o sistema oficial da Caldas Cup 2026.">
  <meta property="og:image" content="https://tiasousa.github.io/caldascup-icon/caldas-cup-compartilhar.jpg">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071c29;font-family:Arial,sans-serif}
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#071c29;opacity:0;transition:opacity .25s ease}
    #app.pronto{opacity:1}
    #acessoInicial{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:clamp(10px,2vw,26px);background:radial-gradient(circle at 20% 0,rgba(40,169,224,.18),transparent 52%),#071c29;transition:opacity .25s ease,visibility .25s ease}
    #acessoInicial.oculto{opacity:0;visibility:hidden;pointer-events:none}
    .caixa{width:min(940px,96vw);height:min(650px,92vh);display:grid;grid-template-columns:minmax(390px,.82fr) minmax(410px,1fr);overflow:hidden;border:1px solid #1f5674;border-radius:25px;background:#0e3247;box-shadow:0 30px 90px rgba(0,0,0,.5)}
    .mascote{min-width:0;background:#092536;overflow:hidden}
    .mascote img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 48%}
    .carregando{display:flex;flex-direction:column;justify-content:center;padding:clamp(25px,5vw,58px);color:#eef4f8;text-align:center}
    .logo{width:112px;height:95px;object-fit:contain;margin:0 auto 16px}
    h1{margin:0;font-size:28px}p{margin:10px 0 24px;color:#8fb4c9;line-height:1.5}
    .campo{height:48px;margin:0 0 14px;border:1px solid #1f5674;border-radius:8px;background:#fff;opacity:.82}
    .botao{height:49px;border-radius:9px;background:linear-gradient(135deg,#ffdb6b,#f4c430);display:flex;align-items:center;justify-content:center;color:#071c29;font-weight:700}
    .status{margin-top:18px;color:#8fb4c9;font-size:12px}.pontos::after{content:"";animation:pontos 1.2s steps(4,end) infinite}@keyframes pontos{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
    @media(max-width:760px){#acessoInicial{align-items:flex-start;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}.caixa{width:100%;height:calc(100dvh - 20px);grid-template-columns:1fr;grid-template-rows:minmax(250px,48dvh) 1fr;border-radius:20px}.carregando{padding:18px}.logo{display:none}h1{font-size:21px}p{font-size:12px;margin:6px 0 14px}.campo{height:42px;margin-bottom:9px}.botao{height:44px}.status{margin-top:10px}}
    @media(max-width:760px) and (max-height:700px){.caixa{grid-template-rows:230px 1fr}.carregando{padding:10px 17px}h1{font-size:18px}p{margin:3px 0 8px}.campo{height:38px;margin-bottom:6px}.botao{height:40px}.status{margin-top:6px}}
    @media(max-height:600px) and (orientation:landscape){.caixa{grid-template-columns:.8fr 1.2fr;grid-template-rows:1fr;height:calc(100dvh - 16px)}.carregando{padding:12px 24px}.logo{display:none}}
  </style>
</head>
<body>
  <div id="acessoInicial" aria-live="polite">
    <div class="caixa">
      <div class="mascote"><img src="https://tiasousa.github.io/caldascup-icon/mascote-caldas-cup.jpeg" alt="Caldas Cup Fut7"></div>
      <div class="carregando">
        <img class="logo" src="./icon.png" alt="Caldas Cup">
        <h1>Acesso ao sistema</h1>
        <p>Preparando sistema...</p>
        <div class="campo"></div><div class="campo"></div><div class="botao">Entrar</div>
        <div class="status">Carregando sistema<span class="pontos"></span></div>
      </div>
    </div>
  </div>
  <iframe id="app" title="Sistema Caldas Cup Fut7" src="https://script.google.com/macros/s/AKfycbyIQ4QRv-AQlJxc2_L7Az6agwEBaB70ttV_UL0bH4gCRnn_tQ21UVm4gspdk01GsYRZ/exec" allow="clipboard-read; clipboard-write"></iframe>
  <script>
    (function(){
      var app=document.getElementById('app'),inicio=document.getElementById('acessoInicial');
      app.addEventListener('load',function(){
        window.setTimeout(function(){app.classList.add('pronto');inicio.classList.add('oculto');},900);
      });
    })();
  </script>
</body>
</html>
