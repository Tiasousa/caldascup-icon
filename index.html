<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Caldas Cup Fut7</title>

  <meta name="theme-color" content="#031521">
  <meta name="application-name" content="Caldas Cup Fut7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Caldas Cup">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon.png">

  <style>
    :root{
      --bg:#031521;
      --bg2:#06283a;
      --blue:#28a9e0;
      --cyan:#5cd6d6;
      --gold:#f4c430;
      --gold2:#ffdf6b;
      --text:#eef4f8;
      --muted:#a9c3d1;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      font-family:Arial,Helvetica,sans-serif;
    }

    #app{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      opacity:0;
      background:var(--bg);
      transition:opacity .65s ease;
    }

    #app.visivel{opacity:1}

    #splash{
      position:fixed;
      inset:0;
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      padding:
        calc(20px + env(safe-area-inset-top,0px))
        18px
        calc(20px + env(safe-area-inset-bottom,0px));

      background:
        radial-gradient(circle at 50% 30%,rgba(40,169,224,.22),transparent 28%),
        radial-gradient(circle at 50% 72%,rgba(244,196,48,.09),transparent 34%),
        linear-gradient(155deg,#02111a 0%,#06283a 50%,#031521 100%);

      color:var(--text);
      transition:opacity .75s ease,visibility .75s ease;
    }

    #splash.saindo{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .conteudo{
      width:min(94vw,480px);
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      position:relative;
      z-index:2;
      animation:entrada .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .universo{
      position:relative;
      width:min(78vw,430px);
      height:min(58vh,500px);
      min-height:330px;
      margin-bottom:14px;
      display:grid;
      place-items:center;
      perspective:1200px;
    }

    .halo{
      position:absolute;
      width:82%;
      aspect-ratio:1/1;
      border-radius:50%;
      background:
        radial-gradient(circle,rgba(40,169,224,.30),rgba(40,169,224,.10) 44%,transparent 72%);
      filter:blur(24px);
      animation:pulsar 2.8s ease-in-out infinite;
    }

    .mascote{
      position:relative;
      z-index:3;
      width:min(74vw,380px);
      max-height:min(54vh,470px);
      display:flex;
      align-items:center;
      justify-content:center;
      transform-style:preserve-3d;
      animation:mascoteFlutua 3.4s ease-in-out infinite;
      filter:
        drop-shadow(0 28px 40px rgba(0,0,0,.52))
        drop-shadow(0 0 32px rgba(40,169,224,.28));
    }

    .mascote::before{
      content:"";
      position:absolute;
      inset:9% 10% 7%;
      border-radius:38% 38% 32% 32%;
      background:
        radial-gradient(circle at 50% 48%,rgba(92,214,214,.24),transparent 44%),
        radial-gradient(circle at 50% 62%,rgba(244,196,48,.17),transparent 50%);
      filter:blur(18px);
      z-index:-1;
      animation:brilhoMascote 2.5s ease-in-out infinite;
    }

    .mascote img{
      width:100%;
      height:auto;
      max-height:min(54vh,470px);
      object-fit:contain;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
    }

    .orbita{
      position:absolute;
      border-radius:50%;
      border:2px solid transparent;
      pointer-events:none;
      z-index:1;
    }

    .orbita.azul{
      width:96%;
      height:42%;
      border-top-color:rgba(92,214,214,.86);
      border-bottom-color:rgba(40,169,224,.28);
      filter:drop-shadow(0 0 10px rgba(40,169,224,.62));
      animation:orbitaAzul 4.2s linear infinite;
    }

    .orbita.ouro{
      width:88%;
      height:47%;
      border-left-color:rgba(244,196,48,.85);
      border-right-color:rgba(244,196,48,.24);
      filter:drop-shadow(0 0 10px rgba(244,196,48,.46));
      animation:orbitaOuro 5.1s linear infinite reverse;
    }

    .rastro{
      position:absolute;
      width:88%;
      aspect-ratio:1/1;
      border-radius:50%;
      background:
        conic-gradient(
          from 0deg,
          transparent 0 18%,
          rgba(92,214,214,.36) 21%,
          transparent 26% 56%,
          rgba(244,196,48,.42) 61%,
          transparent 68% 100%
        );
      filter:blur(12px);
      opacity:.58;
      animation:rastroGira 5.6s linear infinite;
      z-index:0;
    }

    @keyframes mascoteFlutua{
      0%,100%{transform:translateY(0) scale(1) rotateY(-1.2deg)}
      50%{transform:translateY(-10px) scale(1.012) rotateY(1.2deg)}
    }

    @keyframes brilhoMascote{
      0%,100%{opacity:.68;transform:scale(.97)}
      50%{opacity:1;transform:scale(1.035)}
    }

    .mini{
      color:var(--gold2);
      font-size:11px;
      font-weight:800;
      letter-spacing:.34em;
      text-transform:uppercase;
      margin-bottom:8px;
    }

    .titulo{
      margin:0;
      font-size:clamp(36px,9vw,50px);
      line-height:1;
      font-weight:900;
      letter-spacing:.055em;
      text-shadow:0 10px 28px rgba(0,0,0,.36);
    }

    .titulo span{color:var(--gold)}

    .sub{
      margin:14px 0 24px;
      color:var(--muted);
      font-size:12px;
      letter-spacing:.17em;
      text-transform:uppercase;
      line-height:1.6;
    }

    .barra{
      width:min(78vw,320px);
      height:8px;
      overflow:hidden;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(40,169,224,.34);
      box-shadow:inset 0 1px 3px rgba(0,0,0,.46),0 0 18px rgba(40,169,224,.14);
    }

    .barra span{
      display:block;
      width:38%;
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),#fff3b0,transparent);
      box-shadow:0 0 16px rgba(244,196,48,.95);
      animation:carregar 1.35s ease-in-out infinite;
    }

    .status{
      min-height:20px;
      margin-top:14px;
      color:#dbe8ee;
      font-size:12px;
      letter-spacing:.08em;
    }

    .status::after{
      content:"";
      animation:pontos 1.25s steps(4,end) infinite;
    }

    #fallback{
      display:none;
      width:min(86vw,360px);
      margin-top:18px;
      padding-top:16px;
      border-top:1px solid rgba(255,255,255,.10);
    }

    #fallback p{
      margin:0 0 13px;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    #abrirDireto{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:46px;
      padding:12px 22px;
      border-radius:12px;
      background:linear-gradient(180deg,var(--gold2),var(--gold));
      color:#071c29;
      font-size:14px;
      font-weight:800;
      text-decoration:none;
      box-shadow:0 10px 28px rgba(244,196,48,.20);
    }

    @keyframes entrada{
      from{opacity:0;transform:translateY(18px) scale(.97)}
      to{opacity:1;transform:none}
    }

    @keyframes orbitaAzul{
      to{transform:rotate(360deg)}
    }

    @keyframes orbitaOuro{
      to{transform:rotate(360deg)}
    }

    @keyframes orbitaVertical{
      to{transform:rotate(360deg)}
    }

    @keyframes rastroGira{
      to{transform:rotate(360deg)}
    }

    @keyframes pulsar{
      0%,100%{transform:scale(.94);opacity:.62}
      50%{transform:scale(1.08);opacity:1}
    }

    @keyframes carregar{
      0%{transform:translateX(-135%)}
      100%{transform:translateX(375%)}
    }

    @keyframes pontos{
      0%{content:""}
      25%{content:"."}
      50%{content:".."}
      75%,100%{content:"..."}
    }

    @media(max-height:680px){
      .universo{
        width:min(76vw,330px);
        height:min(48vh,350px);
        min-height:250px;
        margin-bottom:8px;
      }

      .mascote{
        width:min(70vw,300px);
        max-height:min(46vh,330px);
      }

      .mascote img{
        max-height:min(46vh,330px);
      }

      .orbita.azul{width:94%;height:40%}
      .orbita.ouro{width:86%;height:45%}
      .rastro{width:84%}

      .titulo{font-size:34px}
      .sub{margin:9px 0 16px}
    }
  </style>
</head>

<body>
  <div id="splash" aria-live="polite">
    <div class="conteudo">

      <div class="universo">
        <div class="halo"></div>
        <div class="rastro"></div>
        <div class="orbita azul"></div>
        <div class="orbita ouro"></div>

        <div class="mascote">
          <img
            src="./mascote-caldas-cup.jpeg"
            alt="Mascote Caldas Cup segurando o escudo"
            draggable="false"
          >
        </div>
      </div>

      <div class="mini">Painel de Controle</div>

      <h1 class="titulo">
        CALDAS <span>CUP</span>
      </h1>

      <div class="sub">
        Fut7 · Equipes · Hospedagem · Financeiro
      </div>

      <div class="barra"><span></span></div>

      <div class="status" id="status">Carregando sistema</div>

      <div id="fallback">
        <p>O sistema está demorando mais que o esperado para abrir.</p>

        <a
          id="abrirDireto"
          href="https://script.google.com/macros/s/AKfycbyIQ4QRv-AQlJxc2_L7Az6agwEBaB70ttV_UL0bH4gCRnn_tQ21UVm4gspdk01GsYRZ/exec"
          target="_top"
          rel="noopener"
        >
          ABRIR SISTEMA
        </a>
      </div>

    </div>
  </div>

  <iframe
    id="app"
    title="Sistema Caldas Cup Fut7"
    src="https://script.google.com/macros/s/AKfycbyIQ4QRv-AQlJxc2_L7Az6agwEBaB70ttV_UL0bH4gCRnn_tQ21UVm4gspdk01GsYRZ/exec"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    const splash = document.getElementById('splash');
    const iframe = document.getElementById('app');
    const fallback = document.getElementById('fallback');
    const status = document.getElementById('status');

    const inicio = Date.now();
    const TEMPO_MINIMO_SPLASH = 3000;
    const TEMPO_LIMITE = 15000;

    let iframeCarregado = false;
    let splashEncerrada = false;

    function encerrarSplash(){
      if(splashEncerrada) return;

      const decorrido = Date.now() - inicio;
      const restante = Math.max(0,TEMPO_MINIMO_SPLASH - decorrido);

      window.setTimeout(function(){
        splashEncerrada = true;
        status.textContent = 'Sistema pronto';
        iframe.classList.add('visivel');
        splash.classList.add('saindo');

        window.setTimeout(function(){
          splash.style.display = 'none';
        },800);
      },restante);
    }

    iframe.addEventListener('load',function(){
      iframeCarregado = true;
      encerrarSplash();
    });

    window.setTimeout(function(){
      if(iframeCarregado || splashEncerrada) return;

      status.textContent = 'Ainda carregando';
      fallback.style.display = 'block';
    },TEMPO_LIMITE);
  </script>
</body>
</html>
